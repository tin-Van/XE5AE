<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Search Route</title>
<link
	href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
	rel="stylesheet" />

</head>
<body>
	<div class="container">
		<form th:fragment="search" th:action="@{/order/search}"
			th:object="${route}" method="post">
			<div class="card p-3">
				<div class="card-body row ">
					<div class="col-md-3">
						<label class="form-label" for="departureLocation">Điểm đi:</label>
						<select class="form-control js-example-basic-single" id="myInput"
							th:field="*{departure}" style="width: 250px; font-size: 16px"
							required>
							<option th:each="items : ${locationArray}" th:value="${items.name}" th:text="${items.name}" ></option>
						</select>
					</div>
					<div class="col-md-3" style="width: 40px">
							<label class="form-label"></label> &ensp; <img
								src="/switch_location.svg" alt="switch location"
								class="my-auto switch-location" onclick="swapLocations()"
								style="width: 50px; height: 50px;">
					</div>
					<div class="col-md-3">
						<div class="single-model-search">
							<label class="form-label" for="destinationLocation">Đến
								đến:</label> <select class="form-control js-example-basic-single"
								id="myInput2" th:field="*{destination}"
								style="width: 250px; font-size: 16px;" required>
								<option th:each="items : ${locationArray}" th:value="${items.name}" th:text="${items.name}" ></option>
							</select>
						</div>
					</div>
					<div class="col-md-3">
						<div class="single-model-search">
							<label class="form-label " for="departureDate">Ngày đi:</label> <input
								type="text" id="departureDate" 
								th:name="time"
								th:value="${travelDate}"
								class="custom-input h-75" style="width: 250px; font-size: 16px" />
						</div>
					</div>
					<div class="text-center mt-3">
						<button class="h-100 btn btn-primary" type="submit">Tìm
							chuyến xe</button>
					</div>
				</div>
			</div>
		</form>
	</div>

	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script
		src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script> -->

</body>
</html>
