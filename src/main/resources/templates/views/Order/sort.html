<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-gray-100" th:fragment="sort">
    <div class="max-w-7xl mx-auto mt-5 grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="bg-white border border-gray-200 rounded-lg shadow-lg p-4">
            <h4 class="block text-black font-semibold mb-2 text-center text-2xl">Bộ Lọc tìm kiếm</h4>
            <hr>
            <!-- Giờ đi -->
            <div class="mb-6">
                <h5 for="time" class="block text-gray-700 font-semibold mb-2 text-xl">Giờ đi:</h5>
                <fieldset class="space-y-4">
                    <legend class="sr-only">Chọn giờ đi</legend>
                    <div class="flex items-center">
                        <input type="checkbox" id="morning" class="form-checkbox text-blue-600 text-lg"> 
                        <label for="morning" class="ml-4 text-lg">Sáng sớm 00:00 - 06:00 (<span id="morning-count">0</span>)</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="morning-2" class="form-checkbox text-blue-600 text-lg"> 
                        <label for="morning-2" class="ml-2 text-lg">Buổi sáng 06:00 - 12:00 (<span id="morning-2-count">0</span>)</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="afternoon" class="form-checkbox text-blue-600 text-lg"> 
                        <label for="afternoon" class="ml-2 text-lg">Buổi chiều 12:00 - 18:00 (<span id="afternoon-count">0</span>)</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="evening" class="form-checkbox text-blue-600 text-lg"> 
                        <label for="evening" class="ml-2 text-lg">Buổi tối 18:00 - 24:00 (<span id="evening-count">0</span>)</label>
                    </div>
                </fieldset>
            </div>

            <!-- Clear filter button -->
            <div class="flex justify-center items-center mt-6">
                <button id="clear-filter" class="text-center text-red-500 flex items-center justify-center hover:text-red-600 font-semibold text-lg">
                    Bỏ lọc 
                    <img src="/img/delete.svg" alt="delete icon" class="ml-2 w-5 h-5">
                </button>
            </div>

            <!-- No trips found message -->
            <div id="no-trips-message" class="text-center text-red-600 mt-4 hidden">
                <p class="text-lg">Không có vé xe nào phù hợp với bộ lọc của bạn.</p>
            </div>
        </div>
    </div>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
 // Hàm chuyển đổi giờ:phút thành số phút từ 00:00
    function timeToMinutes(time) {
        const [hours, minutes] = time.split(':').map(num => parseInt(num));
        return hours * 60 + minutes;
    }

    // Hàm lọc các chuyến xe
    function filterTrips() {
        // Lấy các phần tử checkbox và đếm số lượng
        const morningCheckbox = document.getElementById('morning');
        const morning2Checkbox = document.getElementById('morning-2');
        const afternoonCheckbox = document.getElementById('afternoon');
        const eveningCheckbox = document.getElementById('evening');

        const morningCount = document.getElementById('morning-count');
        const morning2Count = document.getElementById('morning-2-count');
        const afternoonCount = document.getElementById('afternoon-count');
        const eveningCount = document.getElementById('evening-count');

        const noTripsMessage = document.getElementById('no-trips-message');
        const busCardsContainers = document.querySelectorAll('.bus-card-container');

        // Đếm số chuyến xe theo từng khung giờ
        let morningCountValue = 0;
        let morning2CountValue = 0;
        let afternoonCountValue = 0;
        let eveningCountValue = 0;
        let visibleTrips = 0;

        busCardsContainers.forEach(container => {
            const departureTime = container.getAttribute('data-departure-time');
            const arrivalTime = container.getAttribute('data-arrival-time');

            // Kiểm tra nếu thời gian không hợp lệ
            if (!departureTime || !arrivalTime || !departureTime.match(/^\d{2}:\d{2}$/) || !arrivalTime.match(/^\d{2}:\d{2}$/)) {
                console.warn('Invalid time format for container:', container);
                return;
            }

            const departureMinutes = timeToMinutes(departureTime);

            let shouldShow = false;

            // Xác định khung giờ và kiểm tra checkbox
            if (departureMinutes >= timeToMinutes('00:00') && departureMinutes < timeToMinutes('06:00')) {
                morningCountValue++;
                if (morningCheckbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('06:00') && departureMinutes < timeToMinutes('12:00')) {
                morning2CountValue++;
                if (morning2Checkbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('12:00') && departureMinutes < timeToMinutes('18:00')) {
                afternoonCountValue++;
                if (afternoonCheckbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('18:00') && departureMinutes < timeToMinutes('24:00')) {
                eveningCountValue++;
                if (eveningCheckbox.checked) shouldShow = true;
            }

            // Hiển thị hoặc ẩn chuyến xe dựa trên bộ lọc
            if (shouldShow || (!morningCheckbox.checked && !morning2Checkbox.checked && !afternoonCheckbox.checked && !eveningCheckbox.checked)) {
                container.style.display = 'block';
                visibleTrips++;
            } else {
                container.style.display = 'none';
            }
        });

        // Cập nhật số chuyến theo từng khung giờ
        morningCount.textContent = morningCountValue;
        morning2Count.textContent = morning2CountValue;
        afternoonCount.textContent = afternoonCountValue;
        eveningCount.textContent = eveningCountValue;

        // Hiển thị thông báo nếu không có chuyến xe phù hợp
        if (visibleTrips === 0) {
            noTripsMessage.classList.remove('hidden');
        } else {
            noTripsMessage.classList.add('hidden');
        }
    }

    // Hàm xóa bộ lọc
    function clearFilters() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(checkbox => (checkbox.checked = false));
        filterTrips();
    }

    // Đăng ký sự kiện
    document.addEventListener('DOMContentLoaded', () => {
        // Gán sự kiện cho các checkbox
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(checkbox => checkbox.addEventListener('change', filterTrips));

        // Gán sự kiện cho nút "Bỏ lọc"
        const clearFilterButton = document.getElementById('clear-filter');
        if (clearFilterButton) {
            clearFilterButton.addEventListener('click', clearFilters);
        }

        // Chạy lọc ban đầu
        filterTrips();
    });

    </script>

</body>
</html>
