<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<title>XE5AE</title>
<link rel="shortcut icon" type="image/icon" href="img/background.jpg" />
<link rel="stylesheet" type="text/css" href="/js/slick/slick.css" />
<link rel="stylesheet" type="text/css" href="/slick/slick-theme.css" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link
	href="https://fonts.googleapis.com/css?family=Poppins:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
	rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Rufina:400,700"
	rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/owl.carousel.min.css">
<link rel="stylesheet" href="/css/owl.theme.default.min.css">
<link rel="stylesheet" href="/css/seat.css">
<link rel="stylesheet" href="/css/responsive.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

</head>
<body th:fragment="seatListFragment" class="seatListFragment">
			<div th:id="'seatFormContainer-' + ${trip.id}"  class="row card border-light mt-5 w-100" style="background-color: transparent; color: white;">
				<div class="card-body">
					<div align="center">
					<div class="row g-0">
						<div class="col-md-4">
							<div class="legend">
								<div class="legend-item">
									<div class="seat-icon seat-unavailable"></div>
									<span class="text-black">Ghế không bán</span>
								</div>
								<div class="legend-item">
									<div class="seat-icon seat-selected"></div>
									<span class="text-black">Đang chọn</span>
								</div>
							</div>
						</div>
						<div class="col-md-8">
							<div class="bus-layout" style="background-color: transparent">
								<br>
								<div class="row row-cols-1 row-cols-md-3 g-0">
									<div class="col" th:each="items : ${seats}">
										<div class="border border-2 border-dark seat rounded"
											th:attr="data-is-booked=${items.isBooked}"
											th:data-seat-id="${items.id}"
											th:classappend="${items.isBooked ? 'seat-booked seat-selected removeSeat' : ''}"
											onclick="selectSeat(this)">
											<div class="seat-back"></div>
											<div class="seat-bottom"></div>
											<input type="hidden" name="tripID" th:value="${trip.id}">
											<input type="hidden" name="seatID" class="seat-id-input"
												value="">
										</div>
									</div>
								</div>
								<div class="row">
									<hr>
									<div class="col-md-6">
										<button type="submit" onclick="submitForm(event)" id="submitBtn" class="btn btn-primary">Đặt
											vé</button>
									</div>
									<div class="col-md-6">
										 <button type="button" onclick="closeForm(this)" class="closeForm btn btn-secondary" th:data-trip-id="${trip.id}" data-bs-dismiss="modal">Close</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->

</body>
</html>
