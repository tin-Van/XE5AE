   		function swapLocations() {
    	const departureInput = document.getElementById('myInput');
    	const destinationInput = document.getElementById('myInput2');
    	const temp = departureInput.value;
    	departureInput.value = destinationInput.value;
    	destinationInput.value = temp;

    	// Trigger sự kiện change cho Thymeleaf

    	destinationInput.dispatchEvent(new Event('change'));

    	// Thêm hiệu ứng chuyển động (nếu bạn đã thêm CSS transition)
    	const switchIcon = document.querySelector('.switch-location');
    	switchIcon.classList.add('animate');
    	setTimeout(() => {
        switchIcon.classList.remove('animate');
    	}, 300);
		}
		
    </script>

<script>
    // Lấy các checkbox và phần tử span
    const morningCheckbox = document.getElementById('morning');
    const morning2Checkbox = document.getElementById('morning-2');
    const afternoonCheckbox = document.getElementById('afternoon');
    const eveningCheckbox = document.getElementById('evening');

    const morningCount = document.getElementById('morning-count');
    const morning2Count = document.getElementById('morning-2-count');
    const afternoonCount = document.getElementById('afternoon-count');
    const eveningCount = document.getElementById('evening-count');

    const noTripsMessage = document.getElementById('no-trips-message');

    // Hàm chuyển đổi giờ:phút thành số phút từ 00:00
    function timeToMinutes(time) {
        const [hours, minutes] = time.split(':').map(num => parseInt(num));
        return hours * 60 + minutes;
    }

    function filterTrips() {
        const busCardsContainers = document.querySelectorAll('.bus-card-container');
        let morningCountValue = 0;
        let morning2CountValue = 0;
        let afternoonCountValue = 0;
        let eveningCountValue = 0;
        let visibleTrips = 0;

        busCardsContainers.forEach(container => {
            const departureTime = container.getAttribute('data-departure-time');
            const arrivalTime = container.getAttribute('data-arrival-time');
            
            // Kiểm tra xem các giá trị có đúng không
            console.log('Departure Time:', departureTime);
            console.log('Arrival Time:', arrivalTime);
            
            // Kiểm tra nếu departureTime có giá trị hợp lệ
            if (!departureTime || !arrivalTime) {
                return;
            }

            // Chuyển thời gian thành số phút để so sánh
            const departureMinutes = timeToMinutes(departureTime);
            const arrivalMinutes = timeToMinutes(arrivalTime);
            
            let shouldShow = false;

            // Kiểm tra thời gian khởi hành và lọc theo giờ
            if (departureMinutes >= timeToMinutes('00:00') && departureMinutes < timeToMinutes('06:00')) {
                morningCountValue++;
                if (morningCheckbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('06:00') && departureMinutes < timeToMinutes('12:00')) {
                morning2CountValue++;
                if (morning2Checkbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('12:00') && departureMinutes < timeToMinutes('18:00')) {
                afternoonCountValue++;
                if (afternoonCheckbox.checked) shouldShow = true;
            }
            if (departureMinutes >= timeToMinutes('18:00') && departureMinutes < timeToMinutes('24:00')) {
                eveningCountValue++;
                if (eveningCheckbox.checked) shouldShow = true;
            }

            // Hiển thị chuyến nếu được chọn hoặc nếu không có bộ lọc
            if (shouldShow || (!morningCheckbox.checked && !morning2Checkbox.checked && !afternoonCheckbox.checked && !eveningCheckbox.checked)) {
                container.style.display = 'block';
                visibleTrips++;
            } else {
                container.style.display = 'none';
            }
        });

        // Cập nhật số chuyến theo từng giờ
        morningCount.innerText = morningCountValue;
        morning2Count.innerText = morning2CountValue;
        afternoonCount.innerText = afternoonCountValue;
        eveningCount.innerText = eveningCountValue;

        // Hiển thị thông báo nếu không có chuyến xe
        if (visibleTrips === 0) {
            noTripsMessage.classList.remove('hidden');
        } else {
            noTripsMessage.classList.add('hidden');
        }
    }

    // Lắng nghe sự kiện thay đổi của các checkbox
    morningCheckbox.addEventListener('change', filterTrips);
    morning2Checkbox.addEventListener('change', filterTrips);
    afternoonCheckbox.addEventListener('change', filterTrips);
    eveningCheckbox.addEventListener('change', filterTrips);

    // Xử lý khi người dùng bấm nút bỏ lọc
    document.getElementById('clear-filter').addEventListener('click', function () {
        morningCheckbox.checked = false;
        morning2Checkbox.checked = false;
        afternoonCheckbox.checked = false;
        eveningCheckbox.checked = false;
        filterTrips();
    });

    // Chạy hàm filterTrips khi trang được tải
    document.addEventListener('DOMContentLoaded', filterTrips);
</script>
