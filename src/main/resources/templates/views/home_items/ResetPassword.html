<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .pin-container {
            display: flex;
            gap: 21px;
            justify-content: center;
            gap: 10px;
        }
        .pin-input {
            width: 50px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div align="center">
        <div class="card" style="width: 40rem;">
            <div class="card-body">
                <h6 class="card-title">Nhập mã xác nhận và mật khẩu mới để tiếp tục</h6>
                <h6 class="card-subtitle mb-2 text-body-secondary">Code được gửi qua mail</h6>
                <hr>
                <!-- Hiển thị thông báo lỗi -->
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>
                <!-- Hiển thị thông báo thành công -->
                <div th:if="${message}" class="alert alert-success" role="alert">
                    <span th:text="${message}"></span>
                </div>
                <form action="/ResetPassword" method="POST">
                    <!-- Mã xác nhận -->
<!--                     <div class="pin-container">
                        <input type="text" maxlength="1" class="pin-input" name="otp1" autofocus required>
                        <input type="text" maxlength="1" class="pin-input" name="otp2" required>
                        <input type="text" maxlength="1" class="pin-input" name="otp3" required>
                        <input type="text" maxlength="1" class="pin-input" name="otp4" required>
                        <input type="text" maxlength="1" class="pin-input" name="otp5" required>
                        <input type="text" maxlength="1" class="pin-input" name="otp6" required>
                    </div> -->
                     <label for="verificationCode" class="form-label">Mã xác nhận:</label>
					<input type="text" id="verificationCode" name="verificationCode"
						class="form-control" oninput="myFunction()" required>
					<hr>
                    <h3 class="card-title">Nhập lại mật khẩu của bạn</h3>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Nhập mật khẩu mới của bạn:</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    </div>
                    <div align="center">
                        <button type="submit" class="btn btn-primary" style="width: 410px;">Đặt lại mật khẩu</button>
                    </div>
                </form>
				<div class="mb-3 mt-3 text-center">
					<form action="/resend-forget-code" method="post"
						onsubmit="disableButtonForTwoMinutes(event)">
						<input type="hidden" th:name="token" id="demo" th:value="${token}" />
						<button type="submit" id="resendButton" class="btn btn-secondary">Lấy
							mã xác thực mới</button>
					</form>
				</div>
				<br>
                <p class="text-body-secondary">Bạn sẽ nhận được email xác nhận khi đặt lại mật khẩu thành công</p>
            </div>
        </div>
    </div>
    
	<script>
		function myFunction() {
			let text = document.getElementById("verificationCode").value;
			document.getElementById("demo").value=text;
		}
	</script>
    <script>
    function disableButtonForTwoMinutes(event) {
        const button = document.getElementById("resendButton");
        
        // Lưu thời gian hết hạn vào localStorage
        const expirationTime = new Date().getTime() + 1 * 60 * 1000; // Thời gian hết hạn là 2 phút
        localStorage.setItem("resendButtonExpiration", expirationTime);

        startCountdown(button, expirationTime);

        // Để gửi form sau khi disable nút
        event.target.submit();
    }

    function startCountdown(button, expirationTime) {
        button.disabled = true; // Disable nút

        const interval = setInterval(() => {
            const currentTime = new Date().getTime();
            const remainingTime = Math.floor((expirationTime - currentTime) / 1000);

            if (remainingTime > 0) {
                button.innerText = `Vui lòng chờ ${remainingTime} giây để lấy mã mới`;
            } else {
                clearInterval(interval);
                button.disabled = false; // Bật lại nút
                button.innerText = "Lấy mã xác thực mới"; // Phục hồi text ban đầu
                localStorage.removeItem("resendButtonExpiration"); // Xóa trạng thái
            }
        }, 1000);
    }

    // Kiểm tra trạng thái khi tải trang
    window.onload = function () {
        const expirationTime = localStorage.getItem("resendButtonExpiration");
        const button = document.getElementById("resendButton");

        if (expirationTime) {
            const currentTime = new Date().getTime();
            if (currentTime < expirationTime) {
                startCountdown(button, expirationTime);
            }
        }
    };
</script>
    <script>
        const inputs = document.querySelectorAll('.pin-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && index > 0 && input.value === '') {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
