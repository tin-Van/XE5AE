<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
<meta charset="UTF-8">
<title>header</title>
</head>
<body>
	<div th:fragment="header">
		<nav class="navbar navbar-expand-lg bg-transparent p-5 ms-5">
			<div class="container-fluid ">
				<a class="navbar-brand text-white fs-2" href="/home" style="position: relative; left:100px">Booking Store</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
					aria-controls="navbarNavDropdown" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon "></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNavDropdown" style="position: relative; left: 40%">
					<ul class="navbar-nav">
						<li class="nav-item ms-3"><a class="nav-link active text-white fs-5"
							aria-current="page" href="/home">Home</a></li>
						<li class="nav-item ms-3"><a class="nav-link active text-white fs-5"
							aria-current="page" href="/home/udnb">Ưu đãi nổi bật</a></li>
						<li class="nav-item ms-3"><a class="nav-link active text-white fs-5"
							aria-current="page" href="/home/tracuu">Tra Cứu</a></li>
						<li class="nav-item ms-3"><a class="nav-link active text-white fs-5"
							aria-current="page" href="/home/lienhe">Hỗ Trợ</a></li>
						<li class="nav-item dropdown ms-3"><a
							class="nav-link dropdown-toggle" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false"> <span
								sec:authorize="isAnonymous()" class="text-white fs-5" style="font-size: 16px">Login</span>
								<span sec:authorize="isAuthenticated()"> <i
									class="fa-regular fa-user text-white " style="font-size: 16px"></i>
							</span>
						</a>
							<ul class="dropdown-menu text-white">
								<li sec:authorize="isAnonymous()"><a class="dropdown-item "
									href="/login">Login</a></li>
								<li sec:authorize="isAuthenticated()"><a
									class="dropdown-item " th:href="@{/logout}">Logout</a></li>
								<li sec:authorize="hasAnyRole('admin','staff','manager')">
									<a class="dropdown-item " th:href="@{/manager}"> Manager </a>
								</li>
								<li sec:authorize="isAuthenticated()"><a
									class="dropdown-item"
									th:href="@{/profile(username=${#authentication.name})}">ManagerUsers</a>
								</li>
							</ul></li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="container">
			<div class="welcome-hero-txt">
				<h2>Welcome To Booking Store</h2>
				<p>Đặt vé nhanh chóng, dễ dàng, thuận tiện tại đây.</p>
			</div>
		</div>
	</div>
</body>

</html>
