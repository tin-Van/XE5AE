	<script th:inline="javascript">
	
    $(document).ready(function() {
       var locations = JSON.parse(/*[[${locations}]]*/);
      var locationData = locations.map(location => ({
        id : location.name,
        text : location.name
      }));
      $('.js-example-basic-single').select2({
    	width: '250px',
        data : locationData,
        placeholder : 'Chọn địa điểm',
        allowClear : true
      });
    });
  </script>
	<script>
        // Kích hoạt Flatpickr
        flatpickr("#departureDate", {
            dateFormat: "d/m/Y",
            defaultDate: "today",
            minDate: "today",
            locale: "vn"
        });

        // Toggle ngày về
        function toggleReturnDate() {
            const isRoundTrip = document.querySelector('input[name="tripType"]:checked').value === 'roundtrip';
            document.getElementById('returnDateGroup').classList.toggle('hidden', !isRoundTrip);
        }

        // Hàm đổi vị trí giữa điểm đi và điểm đến
   		function swapLocations() {
    	const departureInput = document.getElementById('myInput');
    	const destinationInput = document.getElementById('myInput2');
    	const temp = departureInput.value;
    	departureInput.value = destinationInput.value;
    	destinationInput.value = temp;

    	// Trigger sự kiện change cho Thymeleaf
    	departureInput.dispatchEvent(new Event('change'));
    	destinationInput.dispatchEvent(new Event('change'));

    	// Thêm hiệu ứng chuyển động (nếu bạn đã thêm CSS transition)
    	const switchIcon = document.querySelector('.switch-location');
    	switchIcon.classList.add('animate');
    	setTimeout(() => {
        switchIcon.classList.remove('animate');
    	}, 300);
		}
		
    </script>
	<script>
  const departureSelect = document.getElementById('myInput');
  const destinationSelect = document.getElementById('myInput2');
  const travelDateInput = document.getElementById('departureDate');
  $(departureSelect).on('select2:select', function (e) {
	  $(destinationSelect).select2('open');
	});
  $(destinationSelect).on('select2:select', function (e) {
	  travelDateInput.focus(); // Focus vào travelDateInput sau khi chọn điểm đến
	});
</script>
