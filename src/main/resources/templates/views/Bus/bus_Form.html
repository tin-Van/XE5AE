<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main CSS-->
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <!-- Font-icon css-->
    <link rel="stylesheet" type="text/css"
          href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.2/xlsx.full.min.js"></script>
</head>
<body onload="time()" class="app sidebar-mini rtl">
<div th:replace="~{/views/manager_items/header::header}"></div>
<div class="app-sidebar__overlay" data-toggle="sidebar"></div>
<div th:insert="~{/views/Bus/side_bar::side_bar}"></div>
<main class="app-content">
    <div class="row">
        <div class="col-md-12">
            <div class="app-title">
                <ul class="app-breadcrumb breadcrumb">
                    <li class="breadcrumb-item"><b>Quản lí xe</b></li>
                </ul>
                <div id="clock"></div>
            </div>
        </div>
    </div>
    <div class="row">
        <div>
            <form id="busForm" th:object="${bus}" action="/manager/bus"
                  enctype="multipart/form-data" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label">Avatar</label>
                    <!-- Input chọn ảnh -->
                    <input type="file" name="file" id="file" class="form-control"
                           onchange="previewImage(event)">
                    <input type="hidden" th:field="*{avatar}" id="fileAvatar"/>
                    <!-- Hiển thị ảnh hiện tại nếu có -->
                    <div>
                        <img th:if="${bus.avatar != null}"
                             th:src="@{'/img/'+${bus.avatar}}" alt="Bus Avatar"
                             class="img-thumbnail" id="preview" style="max-width: 150px;"/>
                        <img th:if="${bus.avatar == null}" src="" alt="Bus Avatar"
                             class="img-thumbnail" id="preview" style="max-width: 150px;"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input th:field="*{name}" class="form-control" id="name"/>
                </div>
                 <div class="mb-3">
                    <label class="form-label">Mẫu Xe</label>
                    <input th:field="*{model}" class="form-control" id="model"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Biển số xe</label>
                    <input th:field="*{licensePlate}" class="form-control" id="licensePlate"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sức chứa</label>
                    <input th:field="*{capacity}" class="form-control" id="capacity"/>
                </div>
                <button type="button" class="btn btn-primary" onclick="validateForm()">Save</button>
                <button type="button" class="btn btn-danger" onclick="validateRemove()">Remove</button>
            </form>
        </div>
    </div>
</main>
<!-- Essential javascripts for application to work-->
<script src="/js/jquery-3.2.1.min.js"></script>
<script src="/js/popper.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/src/jquery.table2excel.js"></script>
<script src="/js/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.js"></script>
<script type="text/javascript" src="/js/plugins/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="/js/plugins/dataTables.bootstrap.min.js"></script>
<script type="text/javascript" src="/js/time.js"></script>
<script>
    // Preview ảnh khi chọn file
    function previewImage(event) {
        const fileInput = event.target; // Lấy input file
        const preview = document.getElementById('preview'); // Thẻ <img> để hiển thị ảnh

        // Kiểm tra xem file có được chọn hay không
        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();

            // Khi file được tải, đặt URL của ảnh vào thuộc tính `src` của thẻ <img>
            reader.onload = function (e) {
                preview.src = e.target.result; // Cập nhật ảnh hiển thị
            };

            reader.readAsDataURL(fileInput.files[0]); // Đọc file dưới dạng URL
        } else {
            // Nếu không có file, trả về ảnh cũ hoặc xóa src
            const hiddenAvatar = document.getElementById('fileAvatar').value;
            preview.src = hiddenAvatar ? `/img/${hiddenAvatar}` : ''; // Hiển thị ảnh cũ hoặc để trống
        }
    }

    // Validate form trước khi submit
    function validateForm() {
        let fileInput = document.getElementById("file");
        let file = fileInput.value;
        let avatar = document.getElementById("fileAvatar").value.trim();
        let name = document.getElementById("name").value.trim();
        let licensePlate = document.getElementById("licensePlate").value.trim();
        let capacity = document.getElementById("capacity").value.trim();

        // Kiểm tra trường "Name"
        if (name === "") {
            swal("Error", "Vui lòng nhập tên xe!", "warning");
            return;
        }

        // Kiểm tra trường "File" hoặc "Avatar"
        let allowedExtensions = /(\.jpg|\.jpeg|\.png|\.gif|\.webp)$/i;
        if (!file && !avatar) {
            swal("Error", "Vui lòng chọn tệp hình ảnh hợp lệ (jpg, jpeg, png, gif)!", "warning");
            return;
        } else if (file && !allowedExtensions.exec(file)) {
            swal("Error", "Vui lòng chọn tệp hình ảnh hợp lệ (jpg, jpeg, png, gif)!", "warning");
            fileInput.value = ''; // Reset giá trị của input file
            return;
        }

        // Nếu không có file, đặt giá trị `fileAvatar` là rỗng
        if (!fileInput.value) {
            document.getElementById('fileAvatar').value = ''; // Không có file
        }

        // Kiểm tra trường "Biển số xe"
        if (licensePlate === "") {
            swal("Error", "Vui lòng nhập biển số xe!", "warning");
            return;
        }

        // Kiểm tra trường "Sức chứa"
        if (capacity === "" || isNaN(capacity)) {
            swal("Error", "Vui lòng nhập sức chứa hợp lệ!", "warning");
            return;
        }

        // Nếu không có lỗi, cho phép gửi form
        document.getElementById("busForm").submit();
    }

    // Hiển thị xác nhận xóa
    function validateRemove() {
        swal({
            title: "Xác nhận xóa",
            text: "Bạn có chắc chắn muốn xóa dữ liệu này?",
            icon: "warning",
            buttons: ["Hủy", "Xác nhận"],
            dangerMode: true,
        }).then((willDelete) => {
            if (willDelete) {
                document.getElementById("busForm").action = "/manager/bus/remove";
                document.getElementById("busForm").submit();
            }
        });
    }
</script>
</body>
</html>
