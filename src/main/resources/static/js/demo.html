							</div>

							<div class="col-md-6 mb-3">
								<label for="price">Price:</label> <input type="number"

							</div>

						<div class="row">

								<br>

										 onblur="getValueInput()" >

									<span class="badge text-bg-danger">[[${message}]]</span>
								<!-- </form> -->
							</div>
						
						

						<div class="mb-3">
							<label for="stations">Trạm dừng:</label>

								</thead>

										<td th:text="${station.location.name}"></td>
										<td th:text="${station.address}"></td>
										<td th:text="${station.address}"></td>
										<td th:text="${station.address}"></td>

											<button type="button" class="btn btn-secondary w-100 mb-2"

							</div>
						</div>
						<button type="submit" class="btn btn-primary">Save</button>
						<button type="submit" class="btn btn-danger"

						<button formaction="/manager/route/reset"

	<script>
      document.addEventListener("DOMContentLoaded", function () {
          const departureSelect = document.getElementById("departure");
          const destinationSelect = document.getElementById("destination");
          const nameInput = document.getElementById("name");
          const distanceInput = document.getElementById("distance");

          function toRad(degree) {
              return degree * Math.PI / 180;
          }

          // Haversine Formula để tính khoảng cách giữa hai tọa độ
          function haversine(lat1, lon1, lat2, lon2) {
              const R = 6371; // bán kính trái đất tính bằng km
              const dLat = toRad(lat2 - lat1);
              const dLon = toRad(lon2 - lon1);
              const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                        Math.sin(dLon / 2) * Math.sin(dLon / 2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
              const distance = R * c; // khoảng cách tính bằng km
              return distance;
          }

          // Hàm lấy tọa độ từ tên địa danh (dùng OpenStreetMap Nominatim API)
          function getCoordinates(address) {
              const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&addressdetails=1`;

              return fetch(url)
                  .then(response => response.json())
                  .then(data => {
                      if (data && data[0]) {
                          return {
                              lat: parseFloat(data[0].lat),
                              lon: parseFloat(data[0].lon)
                          };
                      } else {
                          throw new Error("Không tìm thấy tọa độ cho địa điểm");
                      }
                  })
                  .catch(error => {
                      console.error("Lỗi lấy tọa độ:", error);
                      throw error;
                  });
          }

          function updateName() {
              const departureText = departureSelect.options[departureSelect.selectedIndex]?.text;
              const destinationText = destinationSelect.options[destinationSelect.selectedIndex]?.text;
              
              if (!departureText || !destinationText) {
                  // Nếu không có lựa chọn hợp lệ, dừng lại
                  distanceInput.value = "Vui lòng chọn điểm khởi hành và điểm đến.";
                  return;
              }

              nameInput.value = departureText + " - " + destinationText;

              // Lấy tọa độ cho các địa điểm
              Promise.all([getCoordinates(departureText), getCoordinates(destinationText)])
                  .then(([origin, destination]) => {
                      // Tính khoảng cách giữa các điểm
                      const distance = haversine(origin.lat, origin.lon, destination.lat, destination.lon);
                      distanceInput.value = `${distance.toFixed(0)}`; // Điền vào trường Distance, làm tròn đến 0 chữ số
                  })
                  .catch(error => {
                      distanceInput.value = "Không thể lấy khoảng cách";
                  });
          }

          departureSelect.addEventListener("change", updateName);
          destinationSelect.addEventListener("change", updateName);

          // Cập nhật tên ngay khi trang tải
          updateName();
      });

      // Validate form
      function validateForm() {
          let name = document.getElementById("name").value.trim();
          let departure = document.getElementById("departure").value.trim();
          let destination = document.getElementById("destination").value.trim();
          let distance = document.getElementById("distance").value.trim();
          let departureDate = document.getElementById("departureDate").value.trim();
          let time = document.getElementById("time").value.trim();
          let estimatedDuration = document.getElementById("estimatedDuration").value.trim();
          let price = document.getElementById("price").value.trim();
          let bus = document.getElementById("bus").value.trim();

          if (name === "") { swal("Error", "Vui lòng nhập tên tuyến đường!", "warning"); return; }
          if (departure === "") { swal("Error", "Vui lòng chọn điểm khởi hành!", "warning"); return; }
          if (destination === "") { swal("Error", "Vui lòng chọn điểm đến!", "warning"); return; }
          if (distance === "" || isNaN(distance)) { swal("Error", "Vui lòng nhập khoảng cách hợp lệ!", "warning"); return; }
          if (departureDate === "") { swal("Error", "Vui lòng nhập ngày khởi hành dự kiến!", "warning"); return; }
          if (time === "") { swal("Error", "Vui lòng nhập thời gian khởi hành!", "warning"); return; }
          if (estimatedDuration === "") { swal("Error", "Vui lòng nhập thời gian dự kiến!", "warning"); return; }
          if (price === "" || isNaN(price)) { swal("Error", "Vui lòng nhập giá tiền hợp lệ!", "warning"); return; }
          if (bus === "") { swal("Error", "Vui lòng chọn xe buýt!", "warning"); return; }

          document.getElementById("routeForm").submit();
      }

      function validateRemove() {
          let routeId = document.getElementById("routeId").value.trim();
          if (routeId === "") {
              swal("Error", "Không thể xóa lộ trình chưa lưu.", "warning");
              return;
          }
          
          swal({
              title: "Xác nhận xóa",
              text: "Bạn có chắc chắn muốn xóa lộ trình này?",
              icon: "warning",
              buttons: ["Hủy", "Xác nhận"],
              dangerMode: true,
          }).then((willDelete) => {
              if (willDelete) {
                  document.getElementById("routeForm").action = "/manager/route/remove";
                  document.getElementById("routeForm").submit();
              }
          });
      }
      </script>
	<script type="text/javascript">
      function toggleStation(button) {
    	    button.classList.toggle('btn-secondary');
    	    button.classList.toggle('btn-success');

    	    var selectedStations = document.getElementById('selectedStations').value;
    	    var stationId = button.value;

    	    if (button.classList.contains('btn-success')) {
    	        // Thêm trạm dừng vào danh sách
    	        selectedStations = selectedStations ? selectedStations + ',' + stationId : stationId;
    	    } else {
    	        // Xóa trạm dừng khỏi danh sách
    	        var stationsArray = selectedStations.split(',');
    	        stationsArray = stationsArray.filter(item => item !== stationId);
    	        selectedStations = stationsArray.join(',');
    	    }

    	    document.getElementById('selectedStations').value = selectedStations;
    	}
      function getvalueStation() {
    	    var stationInputs = document.querySelectorAll('#anime .svalue');
    	    var stationTable = document.querySelectorAll('table#sampleTable button');
    	    var selectedStationsInput = document.getElementById('selectedStations');
    	    var selectedStations = selectedStationsInput.value ? selectedStationsInput.value.split(',').filter(item => item !== "") : [];

    	    stationTable.forEach(button => {
    	        var stationButton = button.value;
    	        var isFound = false;

    	        stationInputs.forEach(input => {
    	            var stationInput = input.value;
    	            if (stationButton === stationInput) {
    	                isFound = true;
    	            }
    	        });

    	        if (isFound) {
    	            button.classList.remove('btn-secondary');
    	            button.classList.add('btn-success');

    	            // Thêm stationId vào selectedStations nếu chưa tồn tại
    	            if (!selectedStations.includes(stationButton)) {
    	                selectedStations.push(stationButton);
    	            }
    	        }

    	    });
    	    // Cập nhật giá trị của input hidden
    	    selectedStationsInput.value = selectedStations.join(','); 
    	}
      window.onload = function() {
    	    /* markSelectedStations(); */
    	    getvalueStation(); // Gọi hàm getvalueStation sau khi markSelectedStations
    	};
      function filterStations() {
    	    var filter = document.getElementById("stationFilter").value.toUpperCase();
    	    var buttons = document.getElementById("stationButtons").getElementsByTagName("button");

    	    for (var i = 0; i < buttons.length; i++) {
    	        var txtValue = buttons[i].textContent || buttons[i].innerText;
    	        if (txtValue.toUpperCase().indexOf(filter) > -1) {
    	            buttons[i].style.display = "";
    	        } else {
    	            buttons[i].style.display = "none";
    	        }
    	    }
    	}

    	// Gắn sự kiện input vào ô tìm kiếm
    	document.getElementById("stationFilter").addEventListener("input", filterStations);
	</script>
	
	<script type="text/javascript">
	function getValueInput() {
		let timeout = null;
		setTimeout(function() {
			clearTimeout(timeout); // Xóa timeout cũ nếu có
	    let x = document.getElementById("myInput2").value;
	    let activeElement = document.activeElement;
	    if (x === "") {
	        alert("Vui lòng chọn tuyến đường.");
	        return; // Dừng hàm và không submit form
	    }
	    if (!activeElement.classList.contains('autocomplete-item')) { // Kiểm tra xem element được focus có phải là item trong danh sách gợi ý không
	    	alert(x)
	    	document.getElementById("myFormRoute").action = "/manager/trip/route/" + x;
	 	    document.getElementById("myFormRoute").submit();
	      }
	    }, 500); 
	  }
	    
	    
	</script>

	<script type="text/javascript">
      	window.onload = getvalueStation;
      </script>
